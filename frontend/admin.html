<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Inventario SENA v3.0</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
<div class="header-content">
    <div class="logo-section">
        
    <div class="logo-icon">
        <img src="https://i.postimg.cc/cHpqyBX5/Logo-sena.jpg" alt="Logo del SENA">
    </div>

    <div class="text-section">
        <h1>Sistema  Inventario de Activos SENA</h1>
        <p>Gestión Inteligente de Activos v3.0</p>
    </div>
    <!--</div>
    <button id="btnActualizar" class="btn btn-primary"> ACTUALIZAR DATOS</button>
    </div>-->
</header>


    <div class="container">
        <!-- Alert Messages -->
        <div id="alertSuccess" class="alert alert-success"></div>
        <div id="alertError" class="alert alert-danger"></div>

        

        <!-- Search and Filters -->
        <div class="search-section">
            <div class="search-header">
                <h2 class="search-title">🔍 Búsqueda y Filtros Avanzados</h2>
            </div>

            <div class="filters-grid">
                <div class="input-group">
                    <label for="searchPlaca">Buscar por Placa</label>
                    <input type="text" id="searchPlaca" placeholder="Ingrese número de placa">
                </div>
                <div class="input-group">
                    <label for="searchNombre">Buscar por Consecutivo</label>
                    <input type="text" id="searchConsec" placeholder="Ingrese consecutivo">
                </div>
                <div class="input-group">
                    <label for="filterResponsable">Responsable</label>
                    <select id="filterResponsable">
                        <option value="">Todos los responsables</option>
                    </select>
                </div>
                <!--<div class="input-group">
                    <label for="filterResponsable">Responsable</label>
                    <select id="filterResponsable">
                        <option value="">Todos los responsables</option>
                    </select>
                </div>-->
            </div>

            <div class="btn-actions">
                <button class="btn btn-primary btn-main">Buscar</button>
                <button class="btn btn-outline btn-main">Limpiar Filtros</button>
                <button class="btn btn-main btn-csv">Exportar CSV</button>
            </div>
        </div>

        <div class="search-section">
    <div class="search-header">
        <h2 class="search-title">📅 Filtrar por Fechas</h2>
    </div>

    <div class="filters-grid">
        <div class="input-group">
            <label for="fechaInicio">Fecha inicial</label>
            <input type="date" id="fechaInicio">
        </div>

        <div class="input-group">
            <label for="fechaFin">Fecha final</label>
            <input type="date" id="fechaFin">
        </div>
    </div>

    <div class="btn-actions">
        <button class="btn btn-primary btn-main">Buscar por Fechas</button>
        <button class="btn btn-outline btn-main">Limpiar Fechas</button> 
    </div>
</div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Cargando datos...</p>
        </div>

        <!-- Table Section -->
        <div class="table-section" id="tableSection">
            <div class="table-header">
                <h2 class="table-title">📋 Resultados del Inventario</h2>
                <div class="table-info">
                    Mostrando <span id="showingFrom">1</span>-<span id="showingTo">50</span> de <span id="totalResults">0</span> artículos
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Descripción Actual</th>
                            <th>Modelo</th>
                            <th>Responsable</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rows will be inserted here -->
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <div class="pagination-info">
                    Página <span id="currentPage">1</span> de <span id="totalPages">1</span>
                </div>
                <div class="pagination-controls">
                    <button class="btn btn-primary btn-sm" id="loadMoreBtn">Ver más</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">📦 Detalle del Artículo</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Detail will be inserted here -->
            </div>
        </div>
    </div>


<script src="/static/scripts.js"></script>
</body>
</html>
<!-- cambios 1.12-->
