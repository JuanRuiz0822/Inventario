<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Inventario SENA v3.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #39A900;
            --secondary-color: #00324D;
            --accent-color: #FF6B35;
            --bg-light: #F5F7FA;
            --text-dark: #2C3E50;
            --text-light: #7F8C8D;
            --success: #27AE60;
            --warning: #F39C12;
            --danger: #E74C3C;
            --border-color: #DFE6E9;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #F5F7FA 0%, #E8EEF2 100%);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #004D73 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--primary-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .stat-card.primary .stat-icon { background: rgba(57, 169, 0, 0.1); color: var(--primary-color); }
        .stat-card.secondary .stat-icon { background: rgba(0, 50, 77, 0.1); color: var(--secondary-color); }
        .stat-card.accent .stat-icon { background: rgba(255, 107, 53, 0.1); color: var(--accent-color); }
        .stat-card.success .stat-icon { background: rgba(39, 174, 96, 0.1); color: var(--success); }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Search and Filters */
        .search-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-light);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(57, 169, 0, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #2E8700;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(57, 169, 0, 0.3);
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover {
            background: #00243A;
        }

        .btn-outline {
            background: white;
            color: var(--text-dark);
            border: 2px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Table */
        .table-section {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .table-header {
            padding: 20px 25px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .table-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .table-info {
            font-size: 14px;
            color: var(--text-light);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--bg-light);
        }

        th {
            padding: 15px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;

        }

        tbody tr {
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(57, 169, 0, 0.05);
        }

        td {
            padding: 15px;
            font-size: 14px;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-success { background: rgba(39, 174, 96, 0.1); color: var(--success); }
        .badge-warning { background: rgba(243, 156, 18, 0.1); color: var(--warning); }
        .badge-danger { background: rgba(231, 76, 60, 0.1); color: var(--danger); }
        .badge-info { background: rgba(0, 50, 77, 0.1); color: var(--secondary-color); }

        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
        }

        /* Pagination */
        .pagination {
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .pagination-info {
            font-size: 14px;
            color: var(--text-light);
        }

        .pagination-controls {
            display: flex;
            gap: 10px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            position: relative;
            background: white;
            max-width: 700px;
            margin: 50px auto;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 25px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--text-light);
            cursor: pointer;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .modal-body {
            padding: 25px;
            max-height: 500px;
            overflow-y: auto;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .detail-item {
            padding: 15px;
            background: var(--bg-light);
            border-radius: 8px;
        }

        .detail-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 15px;
            color: var(--text-dark);
            font-weight: 500;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .filters-grid {
                grid-template-columns: 1fr;
            }

            .btn-actions {
                width: 100%;
            }

            .btn-actions button {
                flex: 1;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: rgba(39, 174, 96, 0.1);
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        .alert-danger {
            background: rgba(231, 76, 60, 0.1);
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

       
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-icon">📦</div>
                <div>
                    <h1>Sistema de Inventario SENA</h1>
                    <div class="subtitle">Gestión Inteligente de Activos v3.0</div>
                </div>
            </div>
            <button class="btn btn-outline" onclick="refreshData()" style="color: rgb(0, 0, 0); border-color: white;">
                🔄 Actualizar Datos
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Alert Messages -->
        <div id="alertSuccess" class="alert alert-success"></div>
        <div id="alertError" class="alert alert-danger"></div>

        

        <!-- Search and Filters -->
        <div class="search-section">
            <div class="search-header">
                <h2 class="search-title">🔍 Búsqueda y Filtros Avanzados</h2>
            </div>

            <div class="filters-grid">
                <div class="input-group">
                    <label for="searchPlaca">Buscar por Placa</label>
                    <input type="text" id="searchPlaca" placeholder="Ingrese número de placa">
                </div>
                <div class="input-group">
                    <label for="searchNombre">Buscar por Nombre</label>
                    <input type="text" id="searchNombre" placeholder="Ingrese nombre del artículo">
                </div>
                <div class="input-group">
                    <label for="filterCategoria">Categoría</label>
                    <select id="filterCategoria">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="filterResponsable">Responsable</label>
                    <select id="filterResponsable">
                        <option value="">Todos los responsables</option>
                    </select>
                </div>
            </div>

            <div class="btn-actions">
                <button class="btn btn-primary" onclick="applyFilters()">🔍 Buscar</button>
                <button class="btn btn-outline" onclick="clearFilters()">🗑️ Limpiar Filtros</button>
                <button class="btn btn-secondary" onclick="exportData()">📥 Exportar CSV</button>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Cargando datos...</p>
        </div>

        <!-- Table Section -->
        <div class="table-section" id="tableSection">
            <div class="table-header">
                <h2 class="table-title">📋 Resultados del Inventario</h2>
                <div class="table-info">
                    Mostrando <span id="showingFrom">1</span>-<span id="showingTo">50</span> de <span id="totalResults">0</span> artículos
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Nombre</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Responsable</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rows will be inserted here -->
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <div class="pagination-info">
                    Página <span id="currentPage">1</span> de <span id="totalPages">1</span>
                </div>
                <div class="pagination-controls">
                    <button class="btn btn-outline btn-sm" onclick="previousPage()">← Anterior</button>
                    <button class="btn btn-outline btn-sm" onclick="nextPage()">Siguiente →</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">📦 Detalle del Artículo</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Detail will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let allArticulos = [];
        let filteredArticulos = [];
        let currentPage = 1;
        const itemsPerPage = 50;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadCategorias();
            loadResponsables();
            loadArticulos();
        });

        // Show alert
        function showAlert(message, type = 'success') {
            const alertElement = type === 'success' ? document.getElementById('alertSuccess') : document.getElementById('alertError');
            alertElement.textContent = message;
            alertElement.style.display = 'block';
            setTimeout(() => {
                alertElement.style.display = 'none';
            }, 5000);
        }

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch('/api/inventario/estadisticas');
                const data = await response.json();
                
                document.getElementById('totalArticulos').textContent = data.total_articulos.toLocaleString();
                document.getElementById('totalHojas').textContent = data.hojas_procesadas.toLocaleString();
                document.getElementById('totalResponsables').textContent = data.responsables_unicos.toLocaleString();
                document.getElementById('valorTotal').textContent = '$' + data.valor_total.toLocaleString('es-CO', {maximumFractionDigits: 0});
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load categorias
        async function loadCategorias() {
            try {
                const response = await fetch('/api/inventario/categorias');
                const categorias = await response.json();
                const select = document.getElementById('filterCategoria');
                
                categorias.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading categorias:', error);
            }
        }

        // Load responsables
        async function loadResponsables() {
            try {
                const response = await fetch('/api/inventario/responsables');
                const responsables = await response.json();
                const select = document.getElementById('filterResponsable');
                
                responsables.forEach(resp => {
                    const option = document.createElement('option');
                    option.value = resp;
                    option.textContent = resp;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading responsables:', error);
            }
        }

        // Load articulos
        async function loadArticulos() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('tableSection').style.display = 'none';
            
            try {
                const response = await fetch('/api/articulos');
                const data = await response.json();
                allArticulos = data.articulos;
                filteredArticulos = [...allArticulos];
                currentPage = 1;
                renderTable();
                showAlert('Datos cargados exitosamente', 'success');
            } catch (error) {
                console.error('Error loading articulos:', error);
                showAlert('Error al cargar los datos', 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('tableSection').style.display = 'block';
            }
        }

        // Apply filters
        function applyFilters() {
            const placa = document.getElementById('searchPlaca').value.toLowerCase();
            const nombre = document.getElementById('searchNombre').value.toLowerCase();
            const categoria = document.getElementById('filterCategoria').value;
            const responsable = document.getElementById('filterResponsable').value;

            filteredArticulos = allArticulos.filter(art => {
                const matchPlaca = !placa || art.placa.toLowerCase().includes(placa);
                const matchNombre = !nombre || art.nombre.toLowerCase().includes(nombre);
                const matchCategoria = !categoria || art.categoria === categoria;
                const matchResponsable = !responsable || art.responsable === responsable;
                
                return matchPlaca && matchNombre && matchCategoria && matchResponsable;
            });

            currentPage = 1;
            renderTable();
            showAlert(`Se encontraron ${filteredArticulos.length} resultados`, 'success');
        }

        // Clear filters
        function clearFilters() {
            document.getElementById('searchPlaca').value = '';
            document.getElementById('searchNombre').value = '';
            document.getElementById('filterCategoria').value = '';
            document.getElementById('filterResponsable').value = '';
            filteredArticulos = [...allArticulos];
            currentPage = 1;
            renderTable();
        }

        // Render table
        function renderTable() {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageArticulos = filteredArticulos.slice(start, end);

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            pageArticulos.forEach(art => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="badge badge-info">${art.placa}</span></td>
                    <td>${art.nombre}</td>
                    <td>${art.marca || 'N/A'}</td>
                    <td>${art.modelo || 'N/A'}</td>
                    <td>${art.responsable}</td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="viewDetail('${art.placa}')">
                            👁️ Ver
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            // Update pagination info
            document.getElementById('showingFrom').textContent = start + 1;
            document.getElementById('showingTo').textContent = Math.min(end, filteredArticulos.length);
            document.getElementById('totalResults').textContent = filteredArticulos.length;
            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('totalPages').textContent = Math.ceil(filteredArticulos.length / itemsPerPage);
        }

        // Pagination
        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
                window.scrollTo(0, 0);
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredArticulos.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
                window.scrollTo(0, 0);
            }
        }

        // View detail
        async function viewDetail(placa) {
            try {
                const response = await fetch(`/api/inventario/${placa}/detalle`);
                const data = await response.json();
                
                if (data.articulo) {
                    const art = data.articulo;
                    const modalBody = document.getElementById('modalBody');
                    modalBody.innerHTML = `
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="detail-label">Placa</div>
                                <div class="detail-value">${art.placa}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Nombre</div>
                                <div class="detail-value">${art.nombre}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Marca</div>
                                <div class="detail-value">${art.marca || 'N/A'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Modelo</div>
                                <div class="detail-value">${art.modelo || 'N/A'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Categoría</div>
                                <div class="detail-value">${art.categoria}</div>
                            </div>
                            
                            <div class="detail-item">
                                <div class="detail-label">Fecha Adquisición</div>
                                <div class="detail-value">${art.fecha_adquisicion || 'N/A'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Ubicación</div>
                                <div class="detail-value">${art.ubicacion}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Responsable</div>
                                <div class="detail-value">${art.responsable}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Hoja de Origen</div>
                                <div class="detail-value">${art.hoja}</div>
                            </div>
                        </div>
                    `;
                    document.getElementById('detailModal').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading detail:', error);
                showAlert('No se pudo cargar el detalle del artículo', 'error');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Refresh data
        async function refreshData() {
            await loadStats();
            await loadArticulos();
        }

        // Export data
        function exportData() {
            const csvContent = convertToCSV(filteredArticulos);
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `inventario_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            showAlert('Datos exportados exitosamente', 'success');
        }

        function convertToCSV(data) {
            const headers = ['Placa', 'Nombre', 'Marca', 'Modelo', 'Categoría', 'Fecha', 'Ubicación', 'Responsable'];
            const rows = data.map(art => [
                art.placa,
                art.nombre,
                art.marca || '',
                art.modelo || '',
                art.categoria,
                art.fecha_adquisicion || '',
                art.ubicacion,
                art.responsable
            ]);
            
            return [headers, ...rows].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
        }
    </script>
</body>
</html>
